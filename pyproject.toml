[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-sandbox"
version = "0.1.0"
description = "Jednoducha aplikace na poznamky pro KDE Plasma (Qt6)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jan Zeman" }]
dependencies = ["PySide6>=6.5"]

[project.scripts]
notes-sandbox = "notesapp.main:main"
notes-sandbox-store = "notesapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
