name: Build RPM & publish dnf repo

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # kvuli vytvoreni Release u tagu
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:42     # stejna generace jako Nobara; zmen podle `cat /etc/fedora-release`
    steps:
      # Minimum, aby fungoval checkout.
      - name: Zakladni nastroje
        run: dnf -y install --setopt=install_weak_deps=False git tar gzip

      - uses: actions/checkout@v4

      - name: Build nastroje
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            rpm-build rpmdevtools createrepo_c libappstream-glib-builder
          # Plugin 'builddep' se lisi nazvem podle generace dnf.
          dnf -y install dnf5-plugins || dnf -y install 'dnf-command(builddep)'

      # Cte BuildRequires primo ze specu, takze se seznam nemuze rozejit.
      - name: Build zavislosti ze specu
        run: dnf -y builddep --setopt=install_weak_deps=False packaging/notes-sandbox.spec

      - name: Build RPM
        run: |
          chmod +x packaging/build-rpm.sh
          ./packaging/build-rpm.sh

      - name: Posbirat balicky
        run: |
          mkdir -p site/rpm
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} site/rpm/ \;
          ls -l site/rpm

      # createrepo_c => dnf umi balicky najit a nainstalovat.
      - name: dnf metadata
        run: createrepo_c site/rpm

      # AppStream katalog => aplikace se ukaze i v Discoveru (grafickem spravci).
      # Bez tohohle kroku funguje jen `dnf install` z prikazove radky.
      - name: AppStream katalog
        run: |
          appstream-builder \
            --packages-dir=site/rpm \
            --temp-dir=$(mktemp -d) \
            --output-dir=appstream \
            --origin=notes-sandbox \
            --basename=notes-sandbox \
            --include-failed \
            --min-icon-size=32
          # Vlozi katalog do repodata jako typ 'appstream'.
          modifyrepo_c --mdtype=appstream \
            appstream/notes-sandbox.xml.gz site/rpm/repodata/
          if [ -f appstream/notes-sandbox-icons.tar.gz ]; then
            modifyrepo_c --mdtype=appstream-icons \
              appstream/notes-sandbox-icons.tar.gz site/rpm/repodata/
          fi

      # Prazdny katalog = aplikace se neukaze v Discoveru. Radeji hlasit hned,
      # nez to zjistovat az stahovanim metadat z Pages.
      - name: Kontrola AppStream katalogu
        run: |
          echo "--- zarazeno do katalogu ---"
          zcat appstream/notes-sandbox.xml.gz | grep -c '<component' || true
          zcat appstream/notes-sandbox.xml.gz | grep -o '<id>[^<]*</id>' || true

          if [ -s appstream/notes-sandbox-failed.xml.gz ] && \
             zcat appstream/notes-sandbox-failed.xml.gz | grep -q '<component'; then
            echo "--- ODMITNUTO (i s duvodem) ---"
            zcat appstream/notes-sandbox-failed.xml.gz
          fi

          if ! zcat appstream/notes-sandbox.xml.gz | grep -q '<component'; then
            echo "::error::AppStream katalog je prazdny - Discover aplikaci neukaze"
            exit 1
          fi

      - name: Uvodni stranka
        run: |
          cp packaging/notes-sandbox.repo site/

          # GitHub Pages nedela vypis adresaru - /rpm/ by byla 404.
          # Odkazy na balicky proto vypisujeme natvrdo.
          LINKS=""
          for f in site/rpm/*.rpm; do
            n=$(basename "$f")
            s=$(du -h "$f" | cut -f1)
            LINKS="${LINKS}<li><a href=\"rpm/${n}\">${n}</a> <small>${s}</small></li>"
          done

          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>notes-sandbox</title>
          <style>body{font-family:system-ui,sans-serif;max-width:44rem;margin:3rem auto;padding:0 1rem;line-height:1.6}
          pre{background:#f4f4f4;padding:1rem;border-radius:6px;overflow-x:auto}
          @media(prefers-color-scheme:dark){body{background:#111;color:#eee}pre{background:#222}a{color:#6bf}}</style>
          <h1>notes-sandbox</h1>
          <p>dnf repozitář pro Fedoru / Nobaru.</p>
          <pre>sudo dnf config-manager --add-repo https://timmy543.github.io/sandbox-linux/notes-sandbox.repo
          sudo dnf install notes-sandbox</pre>
          <h2>Balíčky</h2>
          <ul>${LINKS}</ul>
          <p><a href="notes-sandbox.repo">notes-sandbox.repo</a> &middot;
             <a href="https://github.com/timmy543/sandbox-linux">zdrojový kód</a></p>
          HTML

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: softprops/action-gh-release@v2
        with:
          files: site/rpm/*.rpm
